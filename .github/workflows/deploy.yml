name: Deploy
on: [![Deploy](https://github.com/zhanghai/text-block-history/actions/workflows/deploy.yml/badge.svg?event=public)](https://github.com/zhanghai/text-block-history/actions/workflows/deploy.yml)
  push:
push: 
  push:
    branches: ['master']

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v5
